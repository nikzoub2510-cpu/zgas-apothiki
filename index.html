<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>ZGAS · Αποθήκη</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFD400;
  --bg-alt:#FCFCF7;
  --surface:#FFFFFF;
  --surface-2:#F3F3EE;
  --border:#000000;
  --text:#111111;
  --text-dim:#33301c;
  --text-faint:#5c5730;
  --flame:#111111;
  --flame-dim:#000000;
  --flame-text:#FCFCF7;
  --ok:#111111;
  --warn:#111111;
  --focus:#111111;
  --radius:10px;
  --shadow: 0 4px 14px rgba(0,0,0,.25);
}
/* tint palette used for category chips instead of per-category hues,
   so the whole app stays strictly yellow/black */

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--flame);color:var(--flame-text);}
a{color:inherit;}
button{font-family:inherit;}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}

.mono{font-family:'IBM Plex Mono',monospace;}
.hidden{display:none !important;}

/* ---------- top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:40;
  background:rgba(252,252,247,.94);
  backdrop-filter: blur(10px);
  border-bottom:2px solid var(--border);
}
.topbar-inner{
  max-width:1400px; margin:0 auto;
  display:flex; align-items:center; gap:16px;
  padding:14px 20px;
  flex-wrap:wrap;
}
.brand{
  display:flex; align-items:baseline; gap:10px;
  font-family:'Big Shoulders', sans-serif;
  font-weight:800;
  letter-spacing:.02em;
  white-space:nowrap;
}
.brand-mark{
  width:34px; height:34px; object-fit:contain; align-self:center;
  filter: drop-shadow(0 1px 2px rgba(0,0,0,.4));
}
.brand .z{font-size:26px; color:var(--flame);}
.brand .rest{font-size:15px; color:var(--text-dim); font-weight:600; letter-spacing:.12em;}
.search-wrap{flex:1; min-width:180px; position:relative;}
.search-wrap input{
  width:100%;
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text);
  padding:10px 14px 10px 36px;
  border-radius:999px;
  font-size:14px;
}
.search-wrap svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); opacity:.5; pointer-events:none;}
.search-wrap input::placeholder{color:var(--text-faint);}

.lock-btn{
  display:flex; align-items:center; gap:8px;
  background:var(--surface); border:1px solid var(--border);
  color:var(--text); padding:9px 14px; border-radius:999px;
  cursor:pointer; font-size:13px; font-weight:600;
  transition:.15s;
}
.tab-nav{display:flex; gap:6px;}
.tab-btn{
  padding:9px 16px; border-radius:999px; border:1px solid var(--border);
  background:var(--surface); color:var(--text-dim); font-size:13px; font-weight:700;
  cursor:pointer; white-space:nowrap;
  position:relative;
}
.tab-btn.active{background:var(--flame); color:var(--flame-text); border-color:transparent;}
.notif-badge{
  display:inline-flex; align-items:center; justify-content:center;
  min-width:18px; height:18px; padding:0 5px; margin-left:6px;
  background:#e02020; color:#fff; border-radius:999px;
  font-size:11px; font-weight:800; line-height:1;
  vertical-align:middle;
}
.order-card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:16px; margin-bottom:14px;
}
.pending-grid{
  display:grid; grid-template-columns:1fr 1fr; gap:14px;
}
.pending-grid .order-card{margin-bottom:0;}
@media (max-width:640px){
  .pending-grid{grid-template-columns:1fr;}
}
.order-card h3{margin:0 0 4px; font-family:'Big Shoulders',sans-serif; font-size:19px; text-transform:uppercase;}
.order-meta{font-size:12px; color:var(--text-faint); margin-bottom:10px;}
.order-section{margin-top:14px;}
.order-section h4{font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-dim); margin:0 0 8px;}
.order-line{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:6px 0; border-bottom:1px dashed var(--border);}
.order-line:last-child{border-bottom:none;}
.order-line-name{font-size:13px; flex:1;}
.order-line-code{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-faint); margin-right:8px;}
.role-badge{
  display:inline-block; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:700;
  letter-spacing:.04em; background:var(--flame); color:var(--flame-text); margin-left:2px;
}
.lock-btn.unlocked{ background:rgba(0,0,0,.08); border-color:rgba(0,0,0,.5); color:var(--ok);}
.lock-btn:hover{border-color:var(--flame);}

/* ---------- category rail ---------- */
.cat-rail{
  max-width:1400px; margin:0 auto;
  padding:14px 20px 0;
  display:flex; gap:8px; overflow-x:auto;
  scrollbar-width:thin;
}
.cat-chip{
  flex:0 0 auto;
  display:flex; align-items:center; gap:8px;
  padding:9px 16px;
  border-radius:999px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text-dim);
  font-size:13px; font-weight:600;
  cursor:pointer; white-space:nowrap;
  transition:.15s;
}
.cat-chip .dot{width:8px; height:8px; border-radius:50%;}
.cat-chip:hover{color:var(--text); border-color:var(--text-faint);}
.cat-chip.active{color:#0c0c0c; border-color:transparent;}
.cat-chip.bottles-chip{background:var(--flame); color:var(--flame-text); border-color:var(--flame); border-style:double; border-width:3px;}
.cat-chip.bottles-chip:hover{color:var(--flame-text); opacity:.85;}
.cat-chip.bottles-chip.active{outline:2px solid var(--flame); outline-offset:2px;}

.sub-rail{
  max-width:1400px; margin:0 auto;
  padding:10px 20px 0;
  display:flex; gap:6px; overflow-x:auto; flex-wrap:wrap;
}
.sub-chip{
  flex:0 0 auto;
  padding:6px 13px;
  border-radius:7px;
  border:1px solid var(--border);
  background:transparent;
  color:var(--text-dim);
  font-size:12.5px; font-weight:600;
  cursor:pointer; white-space:nowrap;
  transition:.15s;
}
.sub-chip:hover{color:var(--text);}
.sub-chip.active{background:var(--surface-2); color:var(--text); border-color:var(--text-faint);}
.sub-chip .count{opacity:.55; font-weight:500;}

/* ---------- content ---------- */
.content{max-width:1400px; margin:0 auto; padding:20px;}
.section-head{
  display:flex; align-items:baseline; justify-content:space-between;
  margin: 8px 0 14px;
  flex-wrap:wrap; gap:10px;
}
.section-head h2{
  font-family:'Big Shoulders', sans-serif;
  font-size:22px; font-weight:700; letter-spacing:.01em; margin:0;
  text-transform:uppercase;
}
.add-btn{
  display:flex; align-items:center; gap:6px;
  background:var(--flame); color:var(--flame-text); border:none;
  padding:9px 15px; border-radius:8px; font-weight:700; font-size:13px;
  cursor:pointer;
}
.add-btn:hover{filter:brightness(1.08);}
.add-btn:disabled{background:var(--surface-2); color:var(--text-faint); cursor:not-allowed;}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(306px,1fr));
  gap:14px;
}

/* ---------- card ---------- */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
  display:flex; flex-direction:column;
  transition:border-color .15s;
  position:relative;
}
.card:hover{border-color:var(--text-faint);}
.card.out-of-stock{opacity:.88;}
.oos-badge{
  position:absolute; top:8px; right:8px; z-index:3;
  background:#e02020; color:#fff;
  font-size:10.5px; font-weight:800; letter-spacing:.03em;
  padding:3px 8px; border-radius:5px;
  box-shadow:0 2px 6px rgba(0,0,0,.35);
  pointer-events:none;
}
.card[draggable="true"]{cursor:grab;}
.cat-chip[draggable="true"], .sub-chip[draggable="true"]{cursor:grab;}
.dragging{opacity:.4;}
.cat-chip.drag-hover, .sub-chip.drag-hover{outline:2px dashed var(--flame); outline-offset:2px;}
.card.drag-hover{outline:2px dashed var(--flame); outline-offset:-2px;}
.card-top{
  display:flex; gap:0;
  border-bottom:1px solid var(--border);
}
.card-img{
  width:101px; height:101px; flex:0 0 auto;
  background:var(--bg-alt);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; position:relative;
  border-right:1px solid var(--border);
}
.card-img img{width:100%; height:100%; object-fit:cover; display:block;}
.card-img .ph{color:var(--text-faint);}
.card-info{flex:1; min-width:0; padding:12px 14px; display:flex; flex-direction:column; gap:2px;}
.card-code{font-size:13px; color:var(--text-faint); letter-spacing:.03em;}
.card-name{font-size:16px; font-weight:600; line-height:1.3; color:var(--text);}
.card-brand{font-size:13px; color:var(--flame); font-weight:700; letter-spacing:.03em; text-transform:uppercase;}
.card-notes{font-size:11.5px; color:var(--text-dim); font-style:italic; padding:0 12px; margin-top:-2px;}

.qty-block{padding:10px 12px; display:flex; flex-direction:column; gap:6px; margin-top:auto;}
.qty-row{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.bottle-columns{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
@media (max-width:560px){ .bottle-columns{grid-template-columns:1fr;} }
.bottle-group{display:flex; flex-direction:column; gap:0; border:1px solid var(--border); border-radius:8px; overflow:hidden;}
.bottle-row{
  display:flex; align-items:center; gap:5px;
  padding:6px 8px; background:var(--surface);
  border-bottom:1px solid var(--border);
}
.bottle-row:last-child{border-bottom:none;}
.bottle-row:nth-child(even){background:var(--surface-2);}
.bottle-row-main{display:flex; align-items:center; gap:5px; flex:1; min-width:0;}
.bottle-title{display:flex; align-items:center; gap:4px; font-size:11.5px; flex:1; min-width:0; overflow:hidden;}
.bottle-title span:last-child{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.bottle-quick{display:flex; gap:3px; flex:0 0 auto;}
.bottle-quick button{
  flex:0 0 auto; width:22px; height:22px; padding:0; border-radius:5px; border:1px solid var(--border);
  background:var(--surface-2); color:var(--text-dim); font-size:9.5px; font-weight:700;
  cursor:pointer;
}
.bottle-quick button:hover{border-color:var(--flame); color:var(--text);}
.bottle-quick button:last-child{color:var(--warn); font-weight:800; font-size:11px;}
.qty-input{
  width:28px; text-align:center; font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600;
  background:var(--surface-2); border:none; color:var(--text); padding:0;
  -moz-appearance:textfield;
}
.qty-input::-webkit-outer-spin-button, .qty-input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
.qty-input.zero{color:var(--warn); font-weight:800; text-decoration:underline;}
.qty-input:disabled{opacity:.5;}
.qty-label{font-size:10.5px; color:var(--text-faint); font-weight:600; letter-spacing:.04em; text-transform:uppercase; flex:1;}
.qty-controls{display:flex; align-items:center; gap:0; border:1px solid var(--border); border-radius:7px; overflow:hidden;}
.qty-btn{
  width:26px; height:26px;
  display:flex; align-items:center; justify-content:center;
  background:var(--surface-2); color:var(--text); border:none;
  cursor:pointer; font-size:15px; font-weight:700; line-height:1;
  user-select:none;
}
.qty-btn:hover{background:var(--flame); color:var(--flame-text);}
.qty-btn:disabled{opacity:.3; cursor:not-allowed; background:var(--surface-2); color:var(--text);}
.qty-val{
  min-width:34px; text-align:center; font-family:'IBM Plex Mono',monospace;
  font-size:13px; font-weight:600; padding:0 4px;
}
.qty-val.zero{color:var(--warn); font-weight:800; text-decoration:underline;}

.card-actions{
  display:flex; border-top:1px solid var(--border);
}
.card-actions button{
  flex:1; background:transparent; border:none; color:var(--text-faint);
  padding:7px; font-size:11px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:5px;
}
.card-actions button:hover{color:var(--warn); background:rgba(138,109,0,.15);}

.empty-state{
  padding:50px 20px; text-align:center; color:var(--text-faint);
  border:1px dashed var(--border); border-radius:var(--radius);
}

/* ---------- modals ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(10,11,13,.72);
  display:flex; align-items:center; justify-content:center;
  z-index:100; padding:20px; backdrop-filter:blur(3px);
}
.modal{
  background:var(--bg-alt); border:1px solid var(--border); border-radius:14px;
  max-width:420px; width:100%; padding:24px; box-shadow:var(--shadow);
  max-height:88vh; overflow-y:auto;
}
.modal h3{
  font-family:'Big Shoulders',sans-serif; font-size:20px; text-transform:uppercase;
  margin:0 0 16px; letter-spacing:.02em;
}
.modal label{display:block; font-size:11.5px; color:var(--text-dim); font-weight:600; margin:12px 0 5px; text-transform:uppercase; letter-spacing:.03em;}
.modal input[type=text], .modal input[type=number], .modal textarea{
  width:100%; background:var(--surface); border:1px solid var(--border); color:var(--text);
  padding:10px 12px; border-radius:8px; font-size:14px; font-family:inherit;
}
.modal textarea{resize:vertical; min-height:60px;}
.modal input.qty-input{
  width:32px !important; padding:0 !important; text-align:center; border-radius:6px;
}
.modal-actions{display:flex; gap:10px; margin-top:20px;}
.btn{
  flex:1; padding:11px; border-radius:8px; border:none; font-weight:700; font-size:13.5px; cursor:pointer;
}
.btn-primary{background:var(--flame); color:var(--flame-text);}
.btn-primary:hover{filter:brightness(1.08);}
.btn-ghost{background:var(--surface); color:var(--text); border:1px solid var(--border);}
.btn-ghost:hover{border-color:var(--text-faint);}
.btn-danger{background:transparent; color:var(--warn); border:1px solid rgba(138,109,0,.5);}
.close-x{position:absolute; top:16px; right:16px; background:none; border:none; color:var(--text-faint); font-size:20px; cursor:pointer;}

.pin-dots{display:flex; gap:12px; justify-content:center; margin:20px 0;}
.pin-dot{width:14px; height:14px; border-radius:50%; border:2px solid var(--border); transition:.1s;}
.pin-dot.filled{background:var(--flame); border-color:var(--flame);}
.pin-pad{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
.pin-pad button{
  padding:16px; border-radius:10px; background:var(--surface); border:1px solid var(--border);
  color:var(--text); font-size:18px; font-weight:600; cursor:pointer;
}
.pin-pad button:hover{border-color:var(--flame);}
.pin-error{color:var(--warn); text-align:center; font-size:13px; min-height:18px; margin-top:8px;}

.img-modal{max-width:520px;}
.img-modal .big-img{width:100%; border-radius:10px; background:var(--bg); display:block; max-height:60vh; object-fit:contain;}
.img-modal .no-img{
  height:260px; display:flex; align-items:center; justify-content:center; color:var(--text-faint);
  background:var(--bg); border-radius:10px; flex-direction:column; gap:8px;
}
.file-drop{
  border:1.5px dashed var(--border); border-radius:10px; padding:16px; text-align:center;
  color:var(--text-dim); font-size:13px; margin-top:14px; cursor:pointer;
  transition:.12s;
}
.file-drop:hover{border-color:var(--flame); color:var(--text);}
.file-drop.drag-hover{border-color:var(--flame); border-style:solid; background:var(--surface-2); color:var(--text);}

.quantities-edit{display:flex; flex-direction:column; gap:8px;}
.quantities-edit .qe-row{display:flex; align-items:center; gap:10px;}
.quantities-edit .qe-row label{margin:0; flex:1; text-transform:none; font-size:13px; color:var(--text);}
.quantities-edit .qe-row input{width:80px;}

/* ---------- setup screen ---------- */
.setup-wrap{
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
}
.setup-card{
  max-width:520px; width:100%; background:var(--bg-alt); border:1px solid var(--border);
  border-radius:16px; padding:32px; box-shadow:var(--shadow);
}
.setup-card h1{
  font-family:'Big Shoulders',sans-serif; font-size:28px; text-transform:uppercase; margin:0 0 4px;
}
.setup-hero{
  display:block; width:88px; height:auto; margin:0 auto 14px;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,.35));
}
.setup-card .sub{color:var(--text-dim); font-size:14px; margin-bottom:22px; line-height:1.5;}
.setup-card ol{color:var(--text-dim); font-size:13.5px; line-height:1.9; padding-left:20px;}
.setup-card code{background:var(--surface-2); padding:2px 6px; border-radius:4px; font-family:'IBM Plex Mono',monospace; font-size:12px;}
.setup-card textarea{
  width:100%; min-height:130px; background:var(--surface); border:1px solid var(--border); color:var(--text);
  padding:12px; border-radius:8px; font-family:'IBM Plex Mono',monospace; font-size:12.5px; margin-top:14px;
}
.setup-err{color:var(--warn); font-size:13px; margin-top:8px; min-height:18px;}

.status-bar{
  display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-faint);
  padding:8px 20px; max-width:1400px; margin:0 auto;
}
.status-dot{width:7px; height:7px; border-radius:50%; background:var(--ok);}
.status-dot.off{background:var(--warn);}
#cartFab{
  position:fixed; bottom:20px; right:20px; z-index:60;
  background:var(--flame); color:var(--flame-text); border:none; border-radius:999px;
  padding:14px 20px; font-size:14px; font-weight:800; cursor:pointer;
  box-shadow:0 4px 14px rgba(0,0,0,.35);
}

@media print{
  body *{visibility:hidden;}
  #printSlip, #printSlip *{visibility:visible;}
  #printSlip{position:absolute; top:0; left:0; width:100%; color:#000; background:#fff; padding:20px;}
  #printSlip .order-line-code, #printSlip .order-line-name, #printSlip b{color:#000;}
  #printSlip .order-section h4{color:#333;}
}
@media (max-width:640px){
  .card-img{width:70px; height:70px;}
  .content{padding:12px;}
  .topbar-inner{padding:10px 12px; gap:8px;}
  .brand{order:1;}
  .tab-nav{order:3; flex:1 1 100%;}
  .search-wrap{order:5; flex:1 1 100%; min-width:0;}
  #roleBtn{order:2; margin-left:auto;}
  .status-bar{padding:6px 12px; font-size:11px;}
  .cat-rail, .sub-rail{padding-left:12px; padding-right:12px;}
  .section-head{gap:8px;}
  .section-head h2{font-size:18px;}
  .qty-btn{width:30px; height:30px; font-size:17px;}
  .overlay{padding:10px; align-items:flex-end;}
  .modal{padding:16px; max-height:92vh; border-radius:14px 14px 0 0;}
  .modal h3{font-size:17px;}
  .pin-pad button{padding:14px;}
  .bottle-title{font-size:12.5px;}
  .order-line{flex-wrap:wrap;}
  .card-actions button{padding:9px 6px; font-size:12px;}
}
@media (max-width:400px){
  .bottle-columns{grid-template-columns:1fr;}
  .bottle-quick button{height:26px; font-size:10.5px;}
}
</style>
</head>

/* Surface any failed Firestore write (e.g. rejected by security rules)
   instead of it silently doing nothing - this is what made "new order"
   and similar buttons look broken with no feedback at all. */
window.addEventListener("unhandledrejection", e=>{
  console.error("Unhandled error:", e.reason);
  const msg = (e.reason && e.reason.message) ? e.reason.message : String(e.reason);
  alert("Κάτι απέτυχε στην αποθήκευση: " + msg + "\n\nΑν συνεχίζει, έλεγξε τους κανόνες (Rules) του Firestore στην κονσόλα Firebase.");

/* ESC closes any open popup; Enter confirms/completes it (unless the
   focus is in a multi-line textarea, where Enter should just add a
   new line). Applies to every modal opened via showModal(). */
document.addEventListener("keydown", e=>{
  const modalRoot = document.getElementById("modalRoot");
  if(!modalRoot || !modalRoot.firstChild) return;
  if(e.key === "Escape"){
    e.preventDefault();
    closeModal();
  } else if(e.key === "Enter"){
    if(e.target && e.target.tagName === "TEXTAREA") return;
    const primaryBtn = modalRoot.querySelector(".btn-primary");
    if(primaryBtn){
      e.preventDefault();
      primaryBtn.click();
    }

});

function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function catList(){
  const map = new Map();
  state.items.forEach(it=>{
    if(!map.has(it.catId)) map.set(it.catId, {id:it.catId, name:it.catName, color:it.catColor, order:it.catOrder});
  });
  return [...map.values()].sort((a,b)=>a.order-b.order);
}
function subList(catId){
  const map = new Map();
  state.items.filter(it=>it.catId===catId).forEach(it=>{
    if(!map.has(it.subId)) map.set(it.subId, {id:it.subId, name:it.subName, order:it.subOrder, count:0});
    if(!it.placeholder) map.get(it.subId).count++;
  });
  return [...map.values()].sort((a,b)=>a.order-b.order);
}
/* optional third level, only used where the admin has actually created one */
function sub2List(catId, subId){
  const map = new Map();
  state.items.filter(it=>it.catId===catId && it.subId===subId && it.sub2Id).forEach(it=>{
    if(!map.has(it.sub2Id)) map.set(it.sub2Id, {id:it.sub2Id, name:it.sub2Name, order:it.sub2Order||0, count:0});
    if(!it.placeholder) map.get(it.sub2Id).count++;

}

function loadFirebase(){
  let cfg = null;
  const raw = localStorage.getItem(LS_CONFIG_KEY);
  if(raw){
    try{ cfg = JSON.parse(raw); }catch(e){ cfg = null; }
  }
  if(!cfg) cfg = DEFAULT_FIREBASE_CONFIG;
  try{
    const app = initializeApp(cfg);
    state.db = getFirestore(app);
    attachListener();
    attachOrdersListener();
    attachTransferNotesListener();
    renderGate();
  }catch(e){
    renderSetup("Σφάλμα σύνδεσης: " + e.message);
  }
}

function attachListener(){
  const colRef = collection(state.db, COLLECTION_NAME);
  onSnapshot(colRef, snap=>{
    state.loaded = true;
    state.connError = null;
    state.items = snap.docs.map(d=>({id:d.id, ...d.data()}));
    update();
    repairEmptySubIds();
  }, err=>{
    state.connError = err.message;
    update();
  });
}

/* One-time self-heal: some Greek-only subcategory names produced an
   empty subId when the item data was first generated, silently merging
   otherwise-distinct subcategories (e.g. ΚΟΥΖΙΝΕΣ/ΕΣΤΙΕΣ/ΦΟΥΡΝΟΙ...) into
   a single blank-id group. subOrder still uniquely identifies each
   original group within its category, so it's used to split them back
   apart and give each a real, unique id. Runs once, admin only. */
let subIdRepairAttempted = false;
async function repairEmptySubIds(){
  if(subIdRepairAttempted || !isAdmin()) return;
  const broken = state.items.filter(it=>!it.placeholder && (it.subId===undefined || it.subId===null || it.subId===""));
  if(!broken.length){ subIdRepairAttempted = true; return; }
  subIdRepairAttempted = true;
  const batch = writeBatch(state.db);
  broken.forEach(it=>{
    const newSubId = `gsub_${it.catId}_${it.subOrder}`;
    batch.update(doc(state.db, COLLECTION_NAME, it.id), {subId: newSubId});
  });
  await batch.commit();
}

function attachOrdersListener(){
  const colRef = collection(state.db, ORDERS_COLLECTION);
  onSnapshot(colRef, snap=>{
    state.ordersLoaded = true;
    state.orders = snap.docs.map(d=>({id:d.id, ...d.data()}));

    console.error("orders listener error", err);

}

function attachTransferNotesListener(){

/* ============ image resize ============ */
function fileToResizedDataUrl(file, maxW=700, quality=0.72){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onload = e=>{ img.src = e.target.result; };
    reader.onerror = reject;
    img.onload = ()=>{
      let w = img.width, h = img.height;
      if(w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, w, h);
      let q = quality;
      let dataUrl = canvas.toDataURL("image/jpeg", q);
      while(dataUrl.length > 900000 && q > 0.3){
        q -= 0.1;
        dataUrl = canvas.toDataURL("image/jpeg", q);
      }
      resolve(dataUrl);
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* Accepts: strict JSON, a bare JS object literal, or a whole pasted code
   snippet (imports, comments, "const firebaseConfig = {...}", etc.) and
   pulls out just the config object. */
function extractFirebaseConfig(text){
  // 1) straightforward JSON
  try{ return JSON.parse(text); }catch(e){}

  // 2) find "firebaseConfig" (or "apiKey" as fallback) then the first {...}
  //    block after it, matched by brace-balance so nested braces are safe.
  let searchFrom = 0;
  const marker = text.indexOf("firebaseConfig");
  if(marker !== -1) searchFrom = marker;
  const braceStart = text.indexOf("{", searchFrom);
  if(braceStart === -1) throw new Error("no object found");
  let depth = 0, end = -1;
  for(let i = braceStart; i < text.length; i++){
    if(text[i] === "{") depth++;
    else if(text[i] === "}"){
      depth--;
      if(depth === 0){ end = i; break; }
    }
  }
  if(end === -1) throw new Error("unbalanced braces");
  const objText = text.slice(braceStart, end + 1);
  return Function('"use strict"; return (' + objText + ')')();
}

/* ============ drag & drop (admin only): re-categorize/reorder items,
   and reorder categories/subcategories themselves ============ */
let draggingItemId = null;
let draggingCatId = null;
let draggingSubId = null;
let dragHoverEl = null;

function onDragStart(e){
  const card = e.target.closest(".card[data-drag-id]");
  if(card){
    draggingItemId = card.dataset.dragId;
    e.dataTransfer.effectAllowed = "move";
    try{ e.dataTransfer.setData("text/plain", draggingItemId); }catch(err){}
    card.classList.add("dragging");
    return;
  }
  const catChip = e.target.closest(".cat-chip[data-drag-cat]");
  if(catChip){
    draggingCatId = catChip.dataset.dragCat;
    e.dataTransfer.effectAllowed = "move";
    catChip.classList.add("dragging");
    return;
  }
  const subChip = e.target.closest(".sub-chip[data-drag-sub]");
  if(subChip){
    draggingSubId = subChip.dataset.dragSub;
    e.dataTransfer.effectAllowed = "move";
    subChip.classList.add("dragging");
    return;
  }
}

function findDropTarget(e){
  if(draggingCatId){
    const chip = e.target.closest(".cat-chip[data-drop-cat]");
    if(chip && chip.dataset.dropCat !== draggingCatId) return {type:"reorder-cat", el:chip};
    return null;
  }
  if(draggingSubId){
    const chip = e.target.closest(".sub-chip[data-drop-sub]");
    if(chip && chip.dataset.dropSub !== draggingSubId) return {type:"reorder-sub", el:chip};
    return null;
  }
  const catChip = e.target.closest("[data-drop-cat]");
  if(catChip) return {type:"cat", el:catChip};
  const subChip = e.target.closest("[data-drop-sub]");
  if(subChip) return {type:"sub", el:subChip};
  const sub2Chip = e.target.closest("[data-drop-sub2]");
  if(sub2Chip) return {type:"sub2", el:sub2Chip};
  const card = e.target.closest(".card[data-drag-id]");
  if(card && card.dataset.dragId !== draggingItemId) return {type:"card", el:card};
  return null;
}

function onDragOver(e){
  if(!draggingItemId && !draggingCatId && !draggingSubId) return;
  const target = findDropTarget(e);
  if(!target) return;
  e.preventDefault();
  if(dragHoverEl && dragHoverEl !== target.el) dragHoverEl.classList.remove("drag-hover");
  target.el.classList.add("drag-hover");
  dragHoverEl = target.el;
}
function onDragLeave(e){
  const target = findDropTarget(e);
  if(target && target.el === dragHoverEl){
    dragHoverEl.classList.remove("drag-hover");
    dragHoverEl = null;
  }
}
function onDragEnd(){
  document.querySelectorAll(".dragging").forEach(c=>c.classList.remove("dragging"));
  if(dragHoverEl){ dragHoverEl.classList.remove("drag-hover"); dragHoverEl = null; }
  draggingItemId = null;
  draggingCatId = null;
  draggingSubId = null;
}
function onDrop(e){
  const target = findDropTarget(e);
  if(!target) return;
  e.preventDefault();
  if(target.type === "reorder-cat"){
    reorderCategory(draggingCatId, target.el.dataset.dropCat);
  } else if(target.type === "reorder-sub"){
    reorderSubcategory(draggingSubId, target.el.dataset.dropSub);
  } else if(target.type === "cat"){
    moveItemToCategory(draggingItemId, target.el.dataset.dropCat);
  } else if(target.type === "sub"){
    moveItemToSubcategoryId(draggingItemId, state.activeCat, target.el.dataset.dropSub);
  } else if(target.type === "sub2"){
    moveItemToSub2Id(draggingItemId, target.el.dataset.dropSub2);
  } else if(target.type === "card"){
    reorderItem(draggingItemId, target.el.dataset.dragId);
  }
  onDragEnd();
}

async function reorderCategory(draggedCatId, targetCatId){
  const cats = catList().sort((a,b)=>a.order-b.order);
  const dragged = cats.find(c=>c.id===draggedCatId);
  if(!dragged) return;
  const without = cats.filter(c=>c.id!==draggedCatId);
  const targetIdx = without.findIndex(c=>c.id===targetCatId);
  if(targetIdx===-1) return;
  without.splice(targetIdx, 0, dragged);
  const batch = writeBatch(state.db);
  without.forEach((c, idx)=>{
    state.items.filter(i=>i.catId===c.id).forEach(it=>{
      batch.update(doc(state.db, COLLECTION_NAME, it.id), {catOrder: idx});
    });
  });
  await batch.commit();
}
async function reorderSubcategory(draggedSubId, targetSubId){
  const catId = state.activeCat;
  const subs = subList(catId).sort((a,b)=>a.order-b.order);
  const dragged = subs.find(s=>s.id===draggedSubId);
  if(!dragged) return;
  const without = subs.filter(s=>s.id!==draggedSubId);
  const targetIdx = without.findIndex(s=>s.id===targetSubId);
  if(targetIdx===-1) return;
  without.splice(targetIdx, 0, dragged);
  const batch = writeBatch(state.db);
  without.forEach((s, idx)=>{
    state.items.filter(i=>i.catId===catId && i.subId===s.id).forEach(it=>{
      batch.update(doc(state.db, COLLECTION_NAME, it.id), {subOrder: idx});
    });
  });
  await batch.commit();
}

async function moveItemToCategory(itemId, catId){
  const cats = catList();
  const cat = cats.find(c=>c.id===catId);
  if(!cat) return;
  const subs = subList(catId);
  if(!subs.length) return;
  await moveItemToSub(itemId, cat, subs[0]);
}
async function moveItemToSubcategoryId(itemId, catId, subId){
  const cats = catList();
  const cat = cats.find(c=>c.id===catId);
  if(!cat) return;
  const subs = subList(catId);
  const sub = subs.find(s=>s.id===subId);
  if(!sub) return;
  await moveItemToSub(itemId, cat, sub);
}
async function moveItemToSub(itemId, cat, sub){
  const item = state.items.find(i=>i.id===itemId);
  if(!item) return;
  if(item.catId===cat.id && item.subId===sub.id) return;
  const siblings = state.items.filter(i=>i.catId===cat.id && i.subId===sub.id);
  const newOrder = siblings.length ? Math.max(...siblings.map(i=>i.itemOrder))+1 : 0;
  await updateDoc(doc(state.db, COLLECTION_NAME, itemId), {
    catId: cat.id, catName: cat.name, catOrder: cat.order, catColor: categoryTint(cat.order),
    subId: sub.id, subName: sub.name, subOrder: sub.order,
    sub2Id: "", sub2Name: "", sub2Order: 0,
    itemOrder: newOrder
  });
}
async function moveItemToSub2Id(itemId, sub2Id){
  const item = state.items.find(i=>i.id===itemId);
  if(!item) return;
  const sub2s = sub2List(item.catId, item.subId);
  const sub2 = sub2s.find(s=>s.id===sub2Id);
  if(!sub2) return;
  await updateDoc(doc(state.db, COLLECTION_NAME, itemId), {
    sub2Id: sub2.id, sub2Name: sub2.name, sub2Order: sub2.order
  });
}
async function reorderItem(draggedId, targetId){
  const dragged = state.items.find(i=>i.id===draggedId);
  const target = state.items.find(i=>i.id===targetId);
  if(!dragged || !target) return;
  if(dragged.catId!==target.catId || dragged.subId!==target.subId) return;
  const siblings = state.items.filter(i=>i.catId===target.catId && i.subId===target.subId).sort((a,b)=>a.itemOrder-b.itemOrder);
  const withoutDragged = siblings.filter(i=>i.id!==draggedId);
  const targetIdx = withoutDragged.findIndex(i=>i.id===targetId);
  withoutDragged.splice(targetIdx, 0, dragged);
  const batch = writeBatch(state.db);
  withoutDragged.forEach((it, idx)=>{
    batch.update(doc(state.db, COLLECTION_NAME, it.id), {itemOrder: idx});
  });
  await batch.commit();
}

function onRootChange(e){
  const el = e.target.closest("[data-action]");
  if(!el) return;
  if(el.dataset.action === "bottle-set"){
    const val = Math.max(0, Math.round(Number(el.value)) || 0);
    el.value = val;
    setOrderBottleQty(el.dataset.order, el.dataset.code, val);
  } else if(el.dataset.action === "namedcart-bottle-set"){
    const val = Math.max(0, Math.round(Number(el.value)) || 0);
    namedBottleCartQty[el.dataset.code] = val;
    refreshNamedCartView();
  } else if(el.dataset.action === "cart-bottle-set"){
    const val = Math.max(0, Math.round(Number(el.value)) || 0);
    bottleCartQty[el.dataset.code] = val;
    renderBottlesCategoryContent();
  }
}

function onRootClick(e){
  const el = e.target.closest("[data-action]");
  if(!el) return;
  const action = el.dataset.action;
  const itemId = el.dataset.item;
  const item = itemId ? state.items.find(i=>i.id===itemId) : null;

  if(action==="cat"){ state.activeCat = el.dataset.cat; state.activeSub = null; state.search=""; document.getElementById("searchInput").value=""; update(); }
  else if(action==="sub"){ state.activeSub = el.dataset.sub; state.activeSub2 = ""; update(); }
  else if(action==="qty-inc" && item){ changeQty(item, el.dataset.key, +1); }
  else if(action==="qty-dec" && item){ changeQty(item, el.dataset.key, -1); }
  else if(action==="open-image" && item){ openImageModal(item); }
  else if(action==="delete-item" && item){ deleteItem(item); }
  else if(action==="edit-item" && item){ openItemModal(item); }
  else if(action==="cart-add" && item){ openAddToCartModal(item); }
  else if(action==="add-item"){ openItemModal(null); }
  else if(action==="add-sub"){ openAddSubModal(); }
  else if(action==="sub2"){ state.activeSub2 = el.dataset.sub2; update(); }
  else if(action==="add-sub2"){ openAddSub2Modal(); }
  else if(action==="add-cat"){ openAddCategoryModal(); }
  else if(action==="seed"){ if(isAdmin()) seedDatabase(); }
  else if(action==="close-modal"){ closeModal(); }
  else if(action==="tab"){ state.activeTab = el.dataset.tab; update(); }
  else if(action==="bottle-inc"){ changeOrderBottleQty(el.dataset.order, el.dataset.code, +1); }
  else if(action==="bottle-dec"){ changeOrderBottleQty(el.dataset.order, el.dataset.code, -1); }
  else if(action==="cart-bottle-inc"){ bottleCartQty[el.dataset.code] = Math.max(0, Number(bottleCartQty[el.dataset.code]||0)+1); renderBottlesCategoryContent(); }
  else if(action==="cart-bottle-dec"){ bottleCartQty[el.dataset.code] = Math.max(0, Number(bottleCartQty[el.dataset.code]||0)-1); renderBottlesCategoryContent(); }
  else if(action==="cart-bottle-quick"){ bottleCartQty[el.dataset.code] = Math.max(0, Number(bottleCartQty[el.dataset.code]||0)+Number(el.dataset.amt)); renderBottlesCategoryContent(); }
  else if(action==="cart-bottle-clear"){ bottleCartQty[el.dataset.code] = 0; renderBottlesCategoryContent(); }
  else if(action==="order-add-product"){ openAddOrderProductModal(el.dataset.order); }
  else if(action==="order-remove-product"){ removeOrderProduct(el.dataset.order, el.dataset.idx); }
  else if(action==="order-add-extinguisher"){ openAddExtinguisherModal(el.dataset.order); }
  else if(action==="order-remove-extinguisher"){ removeOrderExtinguisher(el.dataset.order, el.dataset.idx); }
  else if(action==="order-complete"){ openCompleteOrderModal(el.dataset.order); }
  else if(action==="order-delete"){ deleteOrder(el.dataset.order); }
  else if(action==="order-open"){ state.openOrderId = el.dataset.order; update(); }
  else if(action==="new-order"){ createDraftOrder(state.role); }
  else if(action==="open-transfer-direct"){ transferLines = []; openTransferFormModal(state.role); }
  else if(action==="open-named-client"){ namedBottleCartQty = {}; openNamedClientBottlesModal(el.dataset.order, el.dataset.client); }
  else if(action==="namedcart-bottle-inc"){ namedBottleCartQty[el.dataset.code] = Math.max(0, Number(namedBottleCartQty[el.dataset.code]||0)+1); refreshNamedCartView(); }
  else if(action==="namedcart-bottle-dec"){ namedBottleCartQty[el.dataset.code] = Math.max(0, Number(namedBottleCartQty[el.dataset.code]||0)-1); refreshNamedCartView(); }
  else if(action==="namedcart-bottle-quick"){ namedBottleCartQty[el.dataset.code] = Math.max(0, Number(namedBottleCartQty[el.dataset.code]||0)+Number(el.dataset.amt)); refreshNamedCartView(); }
  else if(action==="namedcart-bottle-clear"){ namedBottleCartQty[el.dataset.code] = 0; refreshNamedCartView(); }
  else if(action==="jump-to-named"){ const el2 = document.getElementById(el.dataset.anchor); if(el2) el2.scrollIntoView({behavior:"smooth", block:"start"}); }
  else if(action==="open-bottles-popup"){ openBottlesPopup(el.dataset.order, false); }
  else if(action==="bottles-popup-edit"){ openBottlesPopup(el.dataset.order, true); }
  else if(action==="bottles-popup-done"){ closeModal(); }
  else if(action==="open-products-popup"){ openProductsPopup(el.dataset.order); }
  else if(action==="open-extinguishers-popup"){ openExtinguishersPopup(el.dataset.order, false); }
  else if(action==="extinguishers-popup-edit"){ openExtinguishersPopup(el.dataset.order, true); }
  else if(action==="extinguishers-popup-done"){ closeModal(); }
  else if(action==="open-order-slip"){ openOrderSlipModal(el.dataset.order); }
  else if(action==="dismiss-transfer-note"){ deleteTransferNote(el.dataset.note); }
  else if(action==="open-cart"){ openCartModal(); }
  else if(action==="cart-remove"){ productCart.splice(Number(el.dataset.idx),1); openCartModal(); updateCartFab(); }
  else if(action==="cart-remove-bottle"){ delete cartBottles[el.dataset.code]; openCartModal(); updateCartFab(); }
  else if(action==="cart-remove-named"){ if(cartNamedBottles[el.dataset.client]) delete cartNamedBottles[el.dataset.client][el.dataset.code]; openCartModal(); updateCartFab(); }
  else if(action==="transfer-line-remove"){ transferLines.splice(Number(el.dataset.idx),1); openTransferFormModal(currentTransferFromStore); }
}

/* ============ status ============ */
function updateStatus(){
  const dot = document.getElementById("statusDot");
  const text = document.getElementById("statusText");
  if(state.connError){
    dot.classList.add("off");
    text.textContent = "Πρόβλημα σύνδεσης: " + state.connError;
  } else if(!state.loaded){
    dot.classList.add("off");
    text.textContent = "Σύνδεση…";
  } else {
    dot.classList.remove("off");
    text.textContent = `Συνδεδεμένο · ${state.items.length} προϊόντα · ζωντανή συγχρονισμένη λίστα`;
  }
  const roleBtn = document.getElementById("roleBtn");
  roleBtn.classList.toggle("unlocked", isAdmin());
  roleBtn.innerHTML = `${isAdmin() ? "🔓" : "👤"} ${esc(roleName(state.role))} <span style="opacity:.6; font-size:11px;">⇄</span>`;

  const pendingCount = state.role === "apothiki" ? state.orders.filter(o=>o.status==="draft").length : 0;
  const tabs = [{id:"inventory", label:"Αποθήκη"}];
  if(state.role !== null) tabs.push({id:"orders", label:"Παραγγελίες"});
  document.getElementById("tabNav").innerHTML = tabs.map(t=>
    `<button class="tab-btn ${state.activeTab===t.id?'active':''}" data-action="tab" data-tab="${t.id}">${t.label}${t.id==="orders" && pendingCount>0 ? `<span class="notif-badge">${pendingCount}</span>` : ""}</button>`
  ).join("");
}

/* ============ main update ============ */
function update(){
  updateStatus();
  updateCartFab();
  document.getElementById("searchWrap").classList.toggle("hidden", state.activeTab !== "inventory");

  if(state.activeTab === "orders"){
    document.getElementById("catRail").innerHTML = "";
    document.getElementById("subRail").innerHTML = ""; document.getElementById("sub2Rail").innerHTML = "";
    renderOrdersTab();
    return;
  }

  if(state.loaded && state.items.length===0){
    document.getElementById("catRail").innerHTML = "";
    document.getElementById("subRail").innerHTML = ""; document.getElementById("sub2Rail").innerHTML = "";
    document.getElementById("content").innerHTML = `
      <div class="empty-state">
        <p>Η βάση είναι άδεια.</p>
        <button class="add-btn" data-action="seed" ${isAdmin() ? "" : "disabled"}>Αρχικοποίηση με τα ${SEED_ITEMS.length} προϊόντα του αρχείου</button>
        ${isAdmin() ? "" : '<div style="margin-top:10px; font-size:12px;">Χρειάζεται ρόλος Διαχειριστή για αρχικοποίηση.</div>'}
      </div>`;
    return;
  }

  const cats = catList();
  if(!state.activeCat && cats.length) state.activeCat = cats[0].id;

  // search mode
  if(state.search.trim().length > 0){
    document.getElementById("catRail").innerHTML = cats.map(c=>catChipHtml(c,false)).join("");
    document.getElementById("subRail").innerHTML = ""; document.getElementById("sub2Rail").innerHTML = "";
    const q = state.search.trim().toLowerCase();
    const companyMatches = [];
    const otherMatches = [];
    state.items.filter(it=>!it.placeholder).forEach(it=>{
      const company = (it.brand || it.subName || "").toLowerCase();
      if(company.includes(q)) companyMatches.push(it);
      else if((it.name||"").toLowerCase().includes(q) || (it.code||"").toLowerCase().includes(q)) otherMatches.push(it);
    });
    const byQty = (a,b)=>totalQty(b)-totalQty(a);
    const results = [...companyMatches.sort(byQty), ...otherMatches.sort(byQty)];
    document.getElementById("content").innerHTML = `
      <div class="section-head"><h2>Αποτελέσματα — "${esc(state.search)}"</h2></div>
      ${results.length ? `<div class="grid">${results.map(cardHtml).join("")}</div>` : emptyStateHtml("Καμία αντιστοιχία.")}
    `;
    return;
  }

  document.getElementById("catRail").innerHTML =
    (isStoreRole() ? `<button class="cat-chip bottles-chip ${state.activeCat==='__bottles__'?'active':''}" data-action="cat" data-cat="__bottles__">🛢️ ΦΙΑΛΕΣ</button>` : "")
    + cats.map(c=>catChipHtml(c, c.id===state.activeCat)).join("")
    + (isAdmin() ? `<button class="cat-chip" data-action="add-cat" style="border-style:dashed;">+ νέα κατηγορία</button>` : "");

  if(state.activeCat === "__bottles__"){
    document.getElementById("subRail").innerHTML = ""; document.getElementById("sub2Rail").innerHTML = "";
    renderBottlesCategoryContent();
    return;
  }

  const subs = subList(state.activeCat);
  if(state.activeSub == null || !subs.find(s=>s.id===state.activeSub)){
    state.activeSub = subs.length ? subs[0].id : null;
  }
  document.getElementById("subRail").innerHTML = subs.map(s=>subChipHtml(s, s.id===state.activeSub)).join("")
    + (isAdmin() ? `<button class="sub-chip" data-action="add-sub" style="border-style:dashed;">+ νέα υποκατηγορία</button>` : "");

  const sub2s = sub2List(state.activeCat, state.activeSub);
  const sub2RailEl = document.getElementById("sub2Rail");
  if(sub2s.length || isAdmin()){
    if(!sub2s.find(s2=>s2.id===state.activeSub2)) state.activeSub2 = "";
    const allCount = state.items.filter(it=>it.catId===state.activeCat && it.subId===state.activeSub && !it.placeholder).length;
    sub2RailEl.innerHTML = `<button class="sub-chip ${state.activeSub2===''?'active':''}" data-action="sub2" data-sub2="">Όλα <span class="count">${allCount}</span></button>`
      + sub2s.map(s2=>`<button class="sub-chip ${s2.id===state.activeSub2?'active':''}" data-action="sub2" data-sub2="${s2.id}" data-drop-sub2="${s2.id}" ${isAdmin() ? `draggable="true" data-drag-sub2="${s2.id}"` : ""}>${esc(s2.name)} <span class="count">${s2.count}</span></button>`).join("")
      + (isAdmin() ? `<button class="sub-chip" data-action="add-sub2" style="border-style:dashed;">+ νέα υπο-υποκατηγορία</button>` : "");
  } else {
    sub2RailEl.innerHTML = "";
  }

  const activeCatMeta = cats.find(c=>c.id===state.activeCat);
  const activeSubMeta = subs.find(s=>s.id===state.activeSub);
  const activeSub2Meta = sub2s.find(s2=>s2.id===state.activeSub2);
  const items = state.items.filter(it=>it.catId===state.activeCat && it.subId===state.activeSub && !it.placeholder
      && (state.activeSub2 === "" || it.sub2Id===state.activeSub2))
    .sort(isAdmin() ? (a,b)=>a.itemOrder-b.itemOrder : (a,b)=>totalQty(b)-totalQty(a) || a.itemOrder-b.itemOrder);

  document.getElementById("content").innerHTML = `
    <div class="section-head">
      <h2>${esc(activeCatMeta?.name||"")}${activeSubMeta ? ' · ' + esc(activeSubMeta.name) : ''}${activeSub2Meta ? ' · ' + esc(activeSub2Meta.name) : ''}</h2>
      <button class="add-btn" data-action="add-item" ${isAdmin() ? "" : "disabled"}>+ Νέο προϊόν</button>
    </div>
    ${items.length ? `<div class="grid">${items.map(cardHtml).join("")}</div>` : emptyStateHtml("Δεν υπάρχουν ακόμα προϊόντα σε αυτή την υποκατηγορία.")}
  `;
}

   the user's cart (draft order) instead of being real tracked stock ---- */
let bottleCartQty = {};
let cartBottles = {};
let cartNamedBottles = {};

function refreshNamedCartView(){
  if(openPopup && openPopup.type==="named"){
    openNamedClientBottlesModal(openPopup.orderId, openPopup.clientName);

    renderBottlesCategoryContent();

function bottleGroupsHtml(cartQty, actionPrefix){
  const HOT_CODES = ["0010", "0025Π"];
  const groups = ["ΜΕΙΓΜΑ", "ΠΡΟΠΑΝΙΟ"];
  return `<div class="bottle-columns">` + groups.map(g=>{
    const rows = BOTTLE_TYPES.filter(b=>b.group===g).map(b=>{
      const v = Number(cartQty[b.code] || 0);
      const isHot = HOT_CODES.includes(b.code);
      return `
      <div class="bottle-row has-quick ${isHot?'hot':''}">
        <div class="bottle-row-main">
          <div class="bottle-title">${isHot?'🔥':''}<span class="order-line-code">#${esc(b.code)}</span><span>${esc(b.name)}</span></div>
          <div class="qty-controls">
            <button class="qty-btn" data-action="${actionPrefix}-dec" data-code="${b.code}">−</button>
            <input type="number" class="qty-input ${v<=0?'zero':''}" min="0" step="1"
              data-action="${actionPrefix}-set" data-code="${b.code}" value="${v}">
            <button class="qty-btn" data-action="${actionPrefix}-inc" data-code="${b.code}">+</button>
          </div>
        </div>
        <div class="bottle-quick">
          <button data-action="${actionPrefix}-quick" data-code="${b.code}" data-amt="2">+2</button>
          <button data-action="${actionPrefix}-quick" data-code="${b.code}" data-amt="5">+5</button>
          <button data-action="${actionPrefix}-quick" data-code="${b.code}" data-amt="10">+10</button>
          <button data-action="${actionPrefix}-clear" data-code="${b.code}" title="Καθαρισμός">✕</button>
        </div>
      </div>`;
    }).join("");
    return `<div><div style="font-size:11px; font-weight:700; color:var(--text-faint); margin-bottom:6px; text-transform:uppercase; letter-spacing:.04em;">${g}</div><div class="bottle-group">${rows}</div></div>`;
  }).join("") + `</div>`;
}

function slugify(s){
  return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/gi,"_").replace(/^_+|_+$/g,"");
}

function renderBottlesCategoryContent(){

        <button class="add-btn" data-action="new-order">+ Νέα παραγγελία</button>
      </div>`;
    return;
  }
  const groupsHtml = bottleGroupsHtml(bottleCartQty, "cart-bottle");

  const clients = NAMED_CLIENTS[order.store] || [];
  const jumpLinksHtml = clients.map(name=>{
    const total = namedClientBottleTotal(order, name);
    return `<button class="add-btn" style="justify-content:space-between; display:flex; margin-top:10px;" data-action="jump-to-named" data-anchor="named-section-${slugify(name)}">
      <span>🛢️ Φιάλες — ${esc(name)}</span><span>${total>0?total:""}</span>
    </button>`;
  }).join("");

  const namedSectionsHtml = clients.map(name=>{

    const inCartClientTotal = Object.values(cartNamedBottles[name]||{}).reduce((a,b)=>a+Number(b||0),0);

    <div id="named-section-${slugify(name)}" style="margin-top:32px; padding-top:18px; border-top:2px dashed var(--border);">
      <div class="section-head"><h2>🛢️ Φιάλες — ${esc(name)}</h2></div>
      <div style="font-size:12px; color:var(--text-faint); margin-bottom:12px;">Ξεχωριστή παραγγελία, δεν μπερδεύεται με τις φιάλες του καταστήματος.<br>Ήδη μέσα: ${currentClientTotal} τεμάχια.${inCartClientTotal>0?` Στο καλάθι αυτή τη στιγμή: ${inCartClientTotal}.`:""} Ρύθμισε παρακάτω τι θέλεις να προσθέσεις τώρα.</div>
      ${bottleGroupsHtml(namedBottleCartQty, "namedcart-bottle")}
      <button class="btn btn-primary" style="width:100%; margin-top:14px;" id="addNamedBottlesBtn" data-client="${esc(name)}" ${stagedClientTotal>0?"":"disabled"}>🛒 Προσθήκη στο καλάθι${stagedClientTotal>0?` (${stagedClientTotal})`:""}</button>
    </div>`;
  }).join("");

  const stagedTotal = Object.values(bottleCartQty).reduce((a,b)=>a+Number(b||0),0);
  const currentTotal = bottleTotal(order);
  const inCartTotal = Object.values(cartBottles).reduce((a,b)=>a+Number(b||0),0);

  content.innerHTML = `

    ${groupsHtml}
    <button class="btn btn-primary" style="width:100%; margin-top:14px;" id="addBottlesToOrderBtn" ${stagedTotal>0?"":"disabled"}>🛒 Προσθήκη στο καλάθι${stagedTotal>0?` (${stagedTotal})`:""}</button>

  `;

  const addBtn = document.getElementById("addBottlesToOrderBtn");

  if(addNamedBtn) addNamedBtn.addEventListener("click", ()=>{
    const clientName = addNamedBtn.dataset.client;

    });

    namedBottleCartQty = {};

    renderBottlesCategoryContent();
  });
}

function emptyStateHtml(msg){
  return `<div class="empty-state">${esc(msg)}</div>`;
}

const CAT_TINTS = ["#FFD400","#E6BE00","#FFC64D","#CBA400","#FFDE70","#B8960A","#FFE9A3","#8f7400"];

  const tint = categoryTint(c.order);
  const style = active ? `style="background:${tint};"` : "";
  return `<button class="cat-chip ${active?'active':''}" ${style} data-action="cat" data-cat="${c.id}" data-drop-cat="${c.id}" ${isAdmin() ? `draggable="true" data-drag-cat="${c.id}"` : ""}>
    <span class="dot" style="background:${active?'#0c0c0c':tint};"></span>${esc(c.name)}
  </button>`;
}
function subChipHtml(s, active){
  return `<button class="sub-chip ${active?'active':''}" data-action="sub" data-sub="${s.id}" data-drop-sub="${s.id}" ${isAdmin() ? `draggable="true" data-drag-sub="${s.id}"` : ""}>
    ${esc(s.name)} <span class="count">${s.count}</span>
  </button>`;
}

/* ============ card ============ */
function cardHtml(it){
  const qKeys = Object.keys(it.quantities||{});
  const isOut = totalQty(it) <= 0;
  const qtyRows = qKeys.map(k=>{
    const v = Number(it.quantities[k]||0);
    return `
    <div class="qty-row">
      <span class="qty-label">${esc(k)}</span>
      <div class="qty-controls">
        <button class="qty-btn" data-action="qty-dec" data-item="${it.id}" data-key="${esc(k)}" ${isAdmin()?"":"disabled"}>−</button>
        <span class="qty-val ${v<=0?'zero':''}">${v}</span>
        <button class="qty-btn" data-action="qty-inc" data-item="${it.id}" data-key="${esc(k)}" ${isAdmin()?"":"disabled"}>+</button>
      </div>
    </div>`;
  }).join("");

  return `
  <div class="card ${isOut?'out-of-stock':''}" ${isAdmin() ? `draggable="true" data-drag-id="${it.id}"` : ""}>
    ${isOut ? `<div class="oos-badge">OUT OF STOCK</div>` : ""}

let productCart = [];

function cartItemCount(){
  const productsQty = productCart.reduce((a,p)=>a+Number(p.qty||0),0);
  const bottlesQty = Object.values(cartBottles).reduce((a,b)=>a+Number(b||0),0);
  const namedQty = Object.values(cartNamedBottles).reduce((a,m)=>a+Object.values(m).reduce((x,y)=>x+Number(y||0),0),0);
  return productsQty + bottlesQty + namedQty;
}
function updateCartFab(){
  const fab = document.getElementById("cartFab");
  if(!fab) return;
  const totalQty = cartItemCount();
  if(isStoreRole() && totalQty>0){
    fab.style.display = "block";
    fab.textContent = `🛒 Καλάθι (${totalQty})`;
  } else {
    fab.style.display = "none";
  }
}

/* ============ modal helpers ============ */
function closeModal(){
  document.getElementById("modalRoot").innerHTML = "";
  openPopup = null;
}
function showModal(html){
  document.getElementById("modalRoot").innerHTML = `<div class="overlay" id="modalOverlay">${html}</div>`;
  // Close only on a direct click on the backdrop itself (not on anything
  // inside the modal box). Using stopPropagation on the modal box used to
  // block the delegated data-action clicks (Cancel/X/etc.) from ever
  // reaching the root click handler - this is the correct fix.
  const overlayEl = document.getElementById("modalOverlay");
  overlayEl.addEventListener("click", e=>{
    if(e.target === overlayEl) closeModal();
  });
}

/* ============ role login (full screen gate) ============ */
let pinBuffer = "";
let selectedRole = null;
let pinKeyHandler = null;

function renderRoleLogin(error){
  selectedRole = null;
  pinBuffer = "";
  detachPinKeyHandler();
  root.innerHTML = `
    <div class="setup-wrap">
      <div class="setup-card" style="text-align:center;">
        <img class="setup-hero" src="${LOGO_HERO}" alt="ZGAS">
        <h1>ZGAS · Αποθήκη</h1>

        <div id="roleGrid" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:18px;">
          ${ROLES.map(r=>`<button class="btn btn-ghost" data-role="${r.id}" style="padding:16px; font-size:14px;">${esc(r.name)}</button>`).join("")}
        </div>
      </div>
    </div>
  `;
  document.getElementById("roleGrid").addEventListener("click", e=>{
    const b = e.target.closest("button[data-role]");
    if(!b) return;
    selectedRole = b.dataset.role;
    renderRolePinScreen();
  });
}

function renderRolePinScreen(error){
  const role = ROLES.find(r=>r.id===selectedRole);
  const len = role.pin.length;
  const dots = Array.from({length: len}, (_,i)=>`<span class="pin-dot ${i<pinBuffer.length?'filled':''}"></span>`).join("");
  root.innerHTML = `
    <div class="setup-wrap">
      <div class="setup-card" style="text-align:center; max-width:340px;">
        <img class="setup-hero" src="${LOGO_ICON}" alt="ZGAS" style="width:56px;">
        <h1 style="font-size:22px;">${esc(role.name)}</h1>
        <div class="sub">Πληκτρολόγησε τον κωδικό (και με το πληκτρολόγιο)</div>
        <div class="pin-dots">${dots}</div>
        <div class="pin-error">${error ? esc(error) : ""}</div>
        <div class="pin-pad" id="pinPad">
          ${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}">${n}</button>`).join("")}
          <button data-n="clear" style="font-size:12px;">Καθαρισμός</button>
          <button data-n="0">0</button>
          <button data-n="back" style="font-size:16px;">⌫</button>
        </div>
        <button class="btn btn-ghost" style="width:100%; margin-top:16px;" id="backToRoles">‹ Πίσω</button>
      </div>
    </div>
  `;
  document.getElementById("pinPad").addEventListener("click", e=>{
    const b = e.target.closest("button");
    if(!b) return;
    handlePinDigit(b.dataset.n);
  });
  document.getElementById("backToRoles").addEventListener("click", ()=>renderRoleLogin());
  attachPinKeyHandler();
}

function handlePinDigit(n){
  const role = ROLES.find(r=>r.id===selectedRole);
  const len = role.pin.length;
  if(n==="clear"){ pinBuffer=""; }
  else if(n==="back"){ pinBuffer = pinBuffer.slice(0,-1); }
  else if(pinBuffer.length<len){ pinBuffer += n; }
  if(pinBuffer.length===len){
    if(pinBuffer===role.pin){
      state.role = selectedRole;
      sessionStorage.setItem(SS_ROLE_KEY, selectedRole);
      detachPinKeyHandler();
      renderShell();
      return;
    } else {
      setTimeout(()=>{ pinBuffer=""; renderRolePinScreen("Λάθος κωδικός."); }, 250);
      return;
    }
  }
  renderRolePinScreen();
}

function attachPinKeyHandler(){
  detachPinKeyHandler();
  pinKeyHandler = (e)=>{
    if(e.key >= "0" && e.key <= "9") handlePinDigit(e.key);
    else if(e.key === "Backspace") handlePinDigit("back");
    else if(e.key === "Escape") renderRoleLogin();
  };
  document.addEventListener("keydown", pinKeyHandler);
}
function detachPinKeyHandler(){
  if(pinKeyHandler){ document.removeEventListener("keydown", pinKeyHandler); pinKeyHandler = null; }
}

      ` : ""}
    </div>
  `);
  if(isAdmin()){
    const handleFile = async (file)=>{
      if(!file || !file.type.startsWith("image/")){
        alert("Παρακαλώ διάλεξε ένα αρχείο εικόνας.");
        return;
      }
      document.getElementById("fileDrop").textContent = "Επεξεργασία…";

        const dataUrl = await fileToResizedDataUrl(file);
        await saveImage(item, dataUrl);
        closeModal();
      }catch(err){
        alert("Δεν μπόρεσα να επεξεργαστώ την εικόνα: " + err.message);
      }
    };
    document.getElementById("fileInput").addEventListener("change", e=>{
      handleFile(e.target.files[0]);
    });
    const dropZone = document.getElementById("fileDrop");
    ["dragenter","dragover"].forEach(evt=>{
      dropZone.addEventListener(evt, e=>{
        e.preventDefault(); e.stopPropagation();
        dropZone.classList.add("drag-hover");
      });
    });
    ["dragleave","dragend"].forEach(evt=>{
      dropZone.addEventListener(evt, e=>{
        e.preventDefault(); e.stopPropagation();
        dropZone.classList.remove("drag-hover");
      });
    });
    dropZone.addEventListener("drop", e=>{
      e.preventDefault(); e.stopPropagation();
      dropZone.classList.remove("drag-hover");
      const file = e.dataTransfer.files && e.dataTransfer.files[0];
      handleFile(file);
    });

    if(rmBtn) rmBtn.addEventListener("click", async ()=>{

/* an order section is only editable while the order is a draft, and only
   by the store that owns it, or by Αποθήκη/Διαχειριστής */
function canEditOrder(order){

/* ---- tracks which popup is currently open, so Firestore-driven updates
   (from another device, or from our own writes) can refresh it live ---- */
let openPopup = null; // {type, orderId, clientName, editMode}
function refreshOpenPopup(){
  if(!openPopup) return;
  const {type, orderId, clientName, editMode} = openPopup;
  if(type==="bottles") openBottlesPopup(orderId, editMode);
  else if(type==="named") openNamedClientBottlesModal(orderId, clientName, editMode);
  else if(type==="products") openProductsPopup(orderId);
  else if(type==="extinguishers") openExtinguishersPopup(orderId, editMode);
}

async function changeOrderBottleQty(orderId, code, delta){
  const order = state.orders.find(o=>o.id===orderId);
  if(!order) return;
  const cur = Number((order.bottles||{})[code]||0);
  const next = Math.max(0, cur+delta);
  const bottles = {...(order.bottles||{}), [code]: next};
  await updateDoc(doc(state.db, ORDERS_COLLECTION, orderId), {bottles, updatedAt: new Date().toISOString()});
  refreshOpenPopup();
}
async function setOrderBottleQty(orderId, code, value){
  const order = state.orders.find(o=>o.id===orderId);
  if(!order) return;
  const bottles = {...(order.bottles||{}), [code]: Math.max(0, Number(value)||0)};
  await updateDoc(doc(state.db, ORDERS_COLLECTION, orderId), {bottles, updatedAt: new Date().toISOString()});
}

async function changeNamedClientBottleQty(orderId, clientName, code, delta){
  const order = state.orders.find(o=>o.id===orderId);
  if(!order) return;
  const clientMap = (order.namedClientBottles && order.namedClientBottles[clientName]) || {};
  const cur = Number(clientMap[code]||0);
  const next = Math.max(0, cur+delta);
  const namedClientBottles = {...(order.namedClientBottles||{}), [clientName]: {...clientMap, [code]: next}};
  await updateDoc(doc(state.db, ORDERS_COLLECTION, orderId), {namedClientBottles, updatedAt: new Date().toISOString()});
  refreshOpenPopup();
}
async function setNamedClientBottleQty(orderId, clientName, code, value){
  const order = state.orders.find(o=>o.id===orderId);
  if(!order) return;
  const clientMap = (order.namedClientBottles && order.namedClientBottles[clientName]) || {};
  const namedClientBottles = {...(order.namedClientBottles||{}), [clientName]: {...clientMap, [code]: Math.max(0, Number(value)||0)}};

/* ---- shipment checklist: Αποθήκη ticks what actually goes out now;
   anything left unticked is carried over into a fresh pending order ---- */
function openCompleteOrderModal(orderId){
  const order = state.orders.find(o=>o.id===orderId);
  if(!order) return;

  const bottleLines = BOTTLE_TYPES
    .map(b=>({...b, qty: Number((order.bottles||{})[b.code]||0)}))
    .filter(b=>b.qty>0);

  const clients = NAMED_CLIENTS[order.store] || [];
  const namedSections = clients.map(name=>{
    const map = (order.namedClientBottles && order.namedClientBottles[name]) || {};
    const lines = BOTTLE_TYPES.map(b=>({...b, qty:Number(map[b.code]||0)})).filter(b=>b.qty>0);
    return {name, lines};
  }).filter(s=>s.lines.length>0);

  const products = order.products || [];
  const extinguishers = order.extinguishers || [];

  const checkRow = (label, code, qty, dataAttrs)=>`
    <div class="order-line">
      <input type="checkbox" class="ship-check" checked ${dataAttrs} style="margin-right:8px;">
      ${code ? `<span class="order-line-code">#${esc(code)}</span>` : ""}
      <span class="order-line-name" style="flex:1;">${esc(label)}</span>
      <input type="number" class="qty-input ship-qty" min="0" max="${qty}" value="${qty}" ${dataAttrs} style="margin-left:8px;">
    </div>`;

  const sections = [];
  if(bottleLines.length){
    sections.push(`<h4>Φιάλες καταστήματος</h4>` + bottleLines.map(b=>
      checkRow(b.name, b.code, b.qty, `data-type="bottle" data-code="${b.code}"`)
    ).join(""));
  }
  namedSections.forEach(s=>{
    sections.push(`<h4>Φιάλες — ${esc(s.name)}</h4>` + s.lines.map(b=>
      checkRow(b.name, b.code, b.qty, `data-type="named" data-client="${esc(s.name)}" data-code="${b.code}"`)
    ).join(""));
  });
  if(products.length){
    sections.push(`<h4>Προϊόντα αποθήκης</h4>` + products.map((p,idx)=>
      checkRow(`${p.company?p.company+" — ":""}${p.name}`, p.code, p.qty, `data-type="product" data-idx="${idx}"`)
    ).join(""));
  }
  if(extinguishers.length){
    sections.push(`<h4>Πυροσβεστήρες αναγόμωσης</h4>` + extinguishers.map((e,idx)=>
      checkRow(`${e.customerName||e.name||""}${e.notes?` — ${e.notes}`:""}`, "", e.qty, `data-type="extinguisher" data-idx="${idx}"`)
    ).join(""));
  }

  showModal(`
    <div class="modal" style="position:relative;">
      <button class="close-x" data-action="close-modal">✕</button>
      <h3>Αποστολή — ${esc(order.storeName)}</h3>
      <div style="font-size:12.5px; color:var(--text-dim); margin-bottom:10px;">Ξετίκαρε ό,τι <b>δεν</b> στέλνεις τώρα, ή άλλαξε την ποσότητα αν στέλνεις λιγότερα — το υπόλοιπο θα μείνει σαν νέα εκκρεμής παραγγελία.</div>
      <div id="shipChecklist" style="max-height:340px; overflow-y:auto;">
        ${sections.length ? sections.join("") : '<div style="font-size:12.5px; color:var(--text-faint);">Δεν υπάρχουν γραμμές σε αυτή την παραγγελία.</div>'}
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" data-action="close-modal">Άκυρο</button>
        <button class="btn btn-primary" id="confirmShipBtn">✓ Αποστολή επιλεγμένων</button>
      </div>
    </div>
  `);

  // unchecking a line disables (and visually zeroes) its quantity field
  document.getElementById("shipChecklist").addEventListener("change", e=>{
    if(!e.target.classList.contains("ship-check")) return;
    const row = e.target.closest(".order-line");
    const qtyInput = row.querySelector(".ship-qty");
    qtyInput.disabled = !e.target.checked;
  });

  document.getElementById("confirmShipBtn").addEventListener("click", async ()=>{
    const rows = Array.from(document.querySelectorAll("#shipChecklist .order-line"));
    const shippedBottles = {}, remainingBottles = {};
    const shippedNamed = {}, remainingNamed = {};
    const shippedProducts = [], remainingProducts = [];
    const shippedExtinguishers = [], remainingExtinguishers = [];

    rows.forEach(row=>{
      const chk = row.querySelector(".ship-check");
      const qtyInput = row.querySelector(".ship-qty");
      const type = chk.dataset.type;
      const maxQty = Number(qtyInput.max);
      const shipQty = chk.checked ? Math.max(0, Math.min(maxQty, Math.round(Number(qtyInput.value))||0)) : 0;
      const remQty = maxQty - shipQty;

      if(type==="bottle"){
        const code = chk.dataset.code;
        if(shipQty>0) shippedBottles[code] = shipQty;
        if(remQty>0) remainingBottles[code] = remQty;
      } else if(type==="named"){
        const client = chk.dataset.client, code = chk.dataset.code;
        if(shipQty>0){ if(!shippedNamed[client]) shippedNamed[client]={}; shippedNamed[client][code]=shipQty; }
        if(remQty>0){ if(!remainingNamed[client]) remainingNamed[client]={}; remainingNamed[client][code]=remQty; }
      } else if(type==="product"){
        const line = products[Number(chk.dataset.idx)];
        if(shipQty>0) shippedProducts.push({...line, qty: shipQty});
        if(remQty>0) remainingProducts.push({...line, qty: remQty});
      } else if(type==="extinguisher"){
        const line = extinguishers[Number(chk.dataset.idx)];
        if(shipQty>0) shippedExtinguishers.push({...line, qty: shipQty});
        if(remQty>0) remainingExtinguishers.push({...line, qty: remQty});
      }
    });

    if(!confirm(`Αποστολή των επιλεγμένων ποσοτήτων για ${order.storeName}; Οι ποσότητες προϊόντων θα αφαιρεθούν από την αποθήκη.`)) return;

    for(const line of shippedProducts){
      if(!line.itemId) continue;
      const item = state.items.find(i=>i.id===line.itemId);
      if(!item) continue;
      const key = mainStockKey(item);
      if(!key) continue;
      const cur = Number(item.quantities?.[key] || 0);
      const next = Math.max(0, cur - Number(line.qty||0));
      await updateDoc(doc(state.db, COLLECTION_NAME, item.id), {[`quantities.${key}`]: next});
    }

    await updateDoc(doc(state.db, ORDERS_COLLECTION, orderId), {
      bottles: shippedBottles,
      namedClientBottles: shippedNamed,
      products: shippedProducts,
      extinguishers: shippedExtinguishers,
      status: "completed",
      completedAt: new Date().toISOString(),
      completedBy: state.role,
      updatedAt: new Date().toISOString()
    });


    const hasRemaining = Object.values(remainingBottles).some(v=>v>0)
      || Object.values(remainingNamed).some(m=>Object.values(m).some(v=>v>0))
      || remainingProducts.length || remainingExtinguishers.length;
    if(hasRemaining){
      const newId = "ord_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
      await setDoc(doc(state.db, ORDERS_COLLECTION, newId), {
        store: order.store, storeName: order.storeName, status: "draft",
        createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(),
        bottles: remainingBottles, namedClientBottles: remainingNamed,
        products: remainingProducts, extinguishers: remainingExtinguishers
      });
    }

    state.openOrderId = null;
    closeModal();
    update();
  });
}

async function deleteOrder(orderId){
  const order = state.orders.find(o=>o.id===orderId);
  if(!order) return;
  const allowed = isStoreRole() ? order.store === state.role : canEditOrder(order);
  if(!allowed) return;
  if(!confirm(`Διαγραφή της παραγγελίας ${order.storeName}; ${order.status==="draft" ? "Δεν θα ολοκληρωθεί και δεν θα αφαιρεθεί τίποτα από την αποθήκη." : "Θα σβηστεί το ιστορικό αυτής της αποστολής."} Αυτή η ενέργεια δεν αναιρείται.`)) return;
  await deleteDoc(doc(state.db, ORDERS_COLLECTION, orderId));
  state.openOrderId = null;
  closeModal();
  update();
}

  const stagedTotal = Object.values(namedBottleCartQty).reduce((a,b)=>a+Number(b||0),0);
  const currentTotal = namedClientBottleTotal(order, clientName);

  showModal(`
    <div class="modal" style="position:relative;">
      <button class="close-x" data-action="close-modal">✕</button>
      <h3>Φιάλες — ${esc(clientName)}</h3>

      <button class="btn btn-primary" style="width:100%; margin-top:14px;" id="addNamedBottlesBtn" ${stagedTotal>0?"":"disabled"}>➕ Προσθήκη στην παραγγελία${stagedTotal>0?` (${stagedTotal})`:""}</button>

  `);

    if(!latestOrder) return;
    const clientMapNow = (latestOrder.namedClientBottles && latestOrder.namedClientBottles[clientName]) || {};
    const updatedMap = {...clientMapNow};
    Object.entries(namedBottleCartQty).forEach(([code, qty])=>{

    const namedClientBottles = {...(latestOrder.namedClientBottles||{}), [clientName]: updatedMap};
    await updateDoc(doc(state.db, ORDERS_COLLECTION, orderId), {namedClientBottles, updatedAt: new Date().toISOString()});

    openNamedClientBottlesModal(orderId, clientName);
  });
}

  const clients = NAMED_CLIENTS[order.store] || [];
  const bottleLines = BOTTLE_TYPES
    .map(b=>({...b, qty: Number((order.bottles||{})[b.code]||0)}))
    .filter(b=>b.qty>0);
  const bottleTotalQty = bottleLines.reduce((a,b)=>a+b.qty,0);

  const namedSections = clients.map(name=>{
    const map = (order.namedClientBottles && order.namedClientBottles[name]) || {};
    const lines = BOTTLE_TYPES.map(b=>({...b, qty:Number(map[b.code]||0)})).filter(b=>b.qty>0);
    const total = lines.reduce((a,b)=>a+b.qty,0);
    return {name, lines, total};
  }).filter(s=>s.lines.length>0);

  const products = order.products || [];
  const productsTotalQty = products.reduce((a,p)=>a+Number(p.qty||0),0);

  const extinguishers = order.extinguishers || [];
  const extinguishersTotalQty = extinguishers.reduce((a,e)=>a+Number(e.qty||0),0);

  const lineRow = (code, name, qty)=>`
    <div class="order-line"><span class="order-line-code">${code?`#${esc(code)}`:""}</span><span class="order-line-name">${esc(name)}</span><b>${qty}</b></div>`;

  return `
    <div style="margin-bottom:10px;">
      <div style="font-size:20px; font-weight:800; font-family:'Big Shoulders',sans-serif; text-transform:uppercase;">Δελτίο Παραγγελίας</div>
      <div style="font-size:13px; color:var(--text-dim);">${esc(order.storeName)} ${order.createdAt ? "· " + new Date(order.createdAt).toLocaleString("el-GR") : ""}</div>
    </div>

    ${bottleLines.length ? `
      <div class="order-section">
        <h4>Φιάλες υγραερίου (καταστήματος)</h4>
        ${bottleLines.map(b=>lineRow(b.code, b.name, b.qty)).join("")}
        <div class="order-line" style="border-top:1px solid var(--border); font-weight:700;"><span></span><span>Σύνολο φιαλών</span><b>${bottleTotalQty}</b></div>
      </div>` : ""}

    ${namedSections.map(s=>`
      <div class="order-section">
        <h4>Φιάλες — ${esc(s.name)}</h4>
        ${s.lines.map(b=>lineRow(b.code, b.name, b.qty)).join("")}
        <div class="order-line" style="border-top:1px solid var(--border); font-weight:700;"><span></span><span>Σύνολο φιαλών ${esc(s.name)}</span><b>${s.total}</b></div>
      </div>`).join("")}

    ${products.length ? `
      <div class="order-section">
        <h4>Προϊόντα αποθήκης</h4>
        ${products.map(p=>lineRow(p.code, (p.company ? p.company + " — " : "") + p.name, p.qty)).join("")}
        <div class="order-line" style="border-top:1px solid var(--border); font-weight:700;"><span></span><span>Σύνολο τεμαχίων</span><b>${productsTotalQty}</b></div>
      </div>` : ""}

    ${extinguishers.length ? `
      <div class="order-section">
        <h4>Πυροσβεστήρες αναγόμωσης</h4>
        ${extinguishers.map(e=>lineRow("", (e.customerName||e.name||"") + (e.notes?` — ${e.notes}`:""), e.qty)).join("")}
        <div class="order-line" style="border-top:1px solid var(--border); font-weight:700;"><span></span><span>Σύνολο πυροσβεστήρων</span><b>${extinguishersTotalQty}</b></div>
      </div>` : ""}

    ${(!bottleLines.length && !namedSections.length && !products.length && !extinguishers.length)
      ? '<div style="font-size:13px; color:var(--text-faint);">Δεν έχουν προστεθεί ακόμα γραμμές σε αυτή την παραγγελία.</div>' : ""}
  `;
}

/* ---- store-to-store transfers: after submitting their own order, a
   store can flag that they also have something to send on to the other
   store, or to the warehouse. This never touches stock quantities or
   creates real inventory items - it's just a heads-up note / a labeled
   line in the destination's order. ---- */
async function getOrCreateDraftOrderForStore(store){
  const existing = state.orders.find(o=>o.store===store && o.status==="draft");
  if(existing) return existing;
  const id = "ord_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  const newOrder = {
    id, store, storeName: roleName(store), status: "draft",
    createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(),
    bottles: {}, products: [], extinguishers: []
  };
  await setDoc(doc(state.db, ORDERS_COLLECTION, id), newOrder);
  return newOrder;
}
async function sendTransferToStore(toStore, code, description, qty, fromStore){
  const order = await getOrCreateDraftOrderForStore(toStore);
  const products = (order.products||[]).slice();
  products.push({itemId: null, code, name: description, company: `Από ${roleName(fromStore)}`, qty});
  await updateDoc(doc(state.db, ORDERS_COLLECTION, order.id), {products, updatedAt: new Date().toISOString()});
}
async function sendTransferToWarehouse(code, description, qty, fromStore){
  const id = "tn_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  await setDoc(doc(state.db, TRANSFER_NOTES_COLLECTION, id), {
    id, fromStore, fromStoreName: roleName(fromStore),
    code, description, qty, createdAt: new Date().toISOString()
  });
}
async function deleteTransferNote(noteId){
  await deleteDoc(doc(state.db, TRANSFER_NOTES_COLLECTION, noteId));
}

function openCartModal(){
  const productRows = productCart.map((p,idx)=>`
    <div class="order-line">
      <span class="order-line-code">#${esc(p.code||"")}</span>
      <span class="order-line-name">${p.company?`<span style="color:var(--flame); font-weight:700;">${esc(p.company)}</span> — `:""}${esc(p.name)} <b>× ${p.qty}</b></span>
      <button data-action="cart-remove" data-idx="${idx}" style="background:none;border:none;color:var(--warn);cursor:pointer;">✕</button>
    </div>`).join("");

  const bottleRows = Object.entries(cartBottles).filter(([,q])=>q>0).map(([code,qty])=>{
    const b = BOTTLE_TYPES.find(x=>x.code===code);
    return `
    <div class="order-line">
      <span class="order-line-code">#${esc(code)}</span>
      <span class="order-line-name">${esc(b?b.name:code)} <b>× ${qty}</b></span>
      <button data-action="cart-remove-bottle" data-code="${code}" style="background:none;border:none;color:var(--warn);cursor:pointer;">✕</button>
    </div>`;
  }).join("");

  const namedBlocks = Object.entries(cartNamedBottles).map(([client, map])=>{
    const rows = Object.entries(map).filter(([,q])=>q>0).map(([code,qty])=>{
      const b = BOTTLE_TYPES.find(x=>x.code===code);
      return `
      <div class="order-line">
        <span class="order-line-code">#${esc(code)}</span>
        <span class="order-line-name">${esc(b?b.name:code)} <b>× ${qty}</b></span>
        <button data-action="cart-remove-named" data-client="${esc(client)}" data-code="${code}" style="background:none;border:none;color:var(--warn);cursor:pointer;">✕</button>
      </div>`;
    }).join("");
    return rows ? `<div style="font-size:11px; font-weight:700; color:var(--text-faint); margin:10px 0 4px; text-transform:uppercase;">Φιάλες — ${esc(client)}</div>${rows}` : "";
  }).join("");

  const hasAnything = productCart.length || Object.values(cartBottles).some(q=>q>0) || Object.values(cartNamedBottles).some(m=>Object.values(m).some(q=>q>0));

  showModal(`
    <div class="modal" style="position:relative;">
      <button class="close-x" data-action="close-modal">✕</button>
      <h3>🛒 Καλάθι</h3>
      ${bottleRows ? `<div style="font-size:11px; font-weight:700; color:var(--text-faint); margin-bottom:4px; text-transform:uppercase;">Φιάλες καταστήματος</div>${bottleRows}` : ""}
      ${namedBlocks}
      ${productRows ? `<div style="font-size:11px; font-weight:700; color:var(--text-faint); margin:10px 0 4px; text-transform:uppercase;">Προϊόντα</div>${productRows}` : ""}
      ${hasAnything ? "" : '<div style="font-size:12.5px; color:var(--text-faint);">Το καλάθι είναι άδειο.</div>'}
      <button class="btn btn-primary" style="width:100%; margin-top:16px;" id="submitCartBtn" ${hasAnything?"":"disabled"}>✓ Αποστολή παραγγελίας</button>
    </div>
  `);

  const submitBtn = document.getElementById("submitCartBtn");
  if(submitBtn) submitBtn.addEventListener("click", async ()=>{
    const order = await getOrCreateDraftOrderForStore(state.role);
    const products = (order.products||[]).slice();
    productCart.forEach(p=>{
      const existingIdx = products.findIndex(x=>x.itemId===p.itemId);
      if(existingIdx >= 0){ products[existingIdx] = {...products[existingIdx], qty: products[existingIdx].qty + p.qty}; }
      else { products.push({...p}); }
    });
    const bottles = {...(order.bottles||{})};
    Object.entries(cartBottles).forEach(([code, qty])=>{
      if(Number(qty)>0) bottles[code] = Number(bottles[code]||0) + Number(qty);
    });
    const namedClientBottles = {...(order.namedClientBottles||{})};
    Object.entries(cartNamedBottles).forEach(([client, map])=>{
      const existing = {...(namedClientBottles[client]||{})};
      Object.entries(map).forEach(([code, qty])=>{
        if(Number(qty)>0) existing[code] = Number(existing[code]||0) + Number(qty);
      });
      namedClientBottles[client] = existing;
    });
    await updateDoc(doc(state.db, ORDERS_COLLECTION, order.id), {products, bottles, namedClientBottles, updatedAt: new Date().toISOString()});
    productCart = [];
    cartBottles = {};
    cartNamedBottles = {};
    updateCartFab();
    openTransferAskModal(state.role);
  });
}
