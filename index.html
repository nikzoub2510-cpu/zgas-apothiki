let transferLines = [];
let currentTransferFromStore = null;

function openTransferFormModal(fromStore){
  currentTransferFromStore = fromStore;
  const otherStore = fromStore === "xania" ? "rethymno" : "xania";
  const currentTo = document.getElementById("transferTo") ? document.getElementById("transferTo").value : "apothiki";

  const linesHtml = transferLines.map((l,idx)=>`
    <div class="order-line">
      <span class="order-line-code">${l.code?`#${esc(l.code)}`:""}</span>
      <span class="order-line-name">${esc(l.description)} <b>× ${l.qty}</b></span>
      <button data-action="transfer-line-remove" data-idx="${idx}" style="background:none;border:none;color:var(--warn);cursor:pointer;">✕</button>
    </div>`).join("");

  showModal(`
    <div class="modal" style="max-width:400px; position:relative;">
      <button class="close-x" data-action="close-modal">✕</button>
      <h3>Αποστολή σε άλλο κατάστημα</h3>
      <label>Από</label>
      <input type="text" value="${esc(roleName(fromStore))}" disabled>
      <label>Προς</label>
      <select id="transferTo">
        <option value="apothiki" ${currentTo==="apothiki"?"selected":""}>ΑΠΟΘΗΚΗ</option>
        <option value="${otherStore}" ${currentTo===otherStore?"selected":""}>${esc(roleName(otherStore))}</option>
      </select>
      <label>Κωδικός προϊόντος</label>
      <input type="text" id="transferCode" placeholder="π.χ. 4398">
      <label>Περιγραφή</label>
      <input type="text" id="transferDesc" placeholder="π.χ. Lofra P BP G96 MFT/C">
      <label>Τεμάχια</label>
      <input type="number" id="transferQty" min="1" value="1">
      <button class="add-btn" style="width:100%; margin-top:12px;" id="addTransferLineBtn">+ Προσθήκη γραμμής</button>
      ${transferLines.length ? `<div style="margin-top:16px;"><label style="margin:0 0 6px;">Γραμμές προς αποστολή</label>${linesHtml}</div>` : ""}
      <div class="modal-actions">
        <button class="btn btn-ghost" id="transferBackBtn">‹ Πίσω</button>
        <button class="btn btn-primary" id="confirmTransferBtn">✓ Ολοκλήρωση αποστολής</button>
      </div>
    </div>
  `);
  document.getElementById("transferBackBtn").addEventListener("click", ()=>{ transferLines = []; openTransferAskModal(fromStore); });

  document.getElementById("addTransferLineBtn").addEventListener("click", ()=>{
    const code = document.getElementById("transferCode").value.trim();
    const desc = document.getElementById("transferDesc").value.trim();
    const qty = Math.max(1, Number(document.getElementById("transferQty").value)||1);
    if(!desc){ alert("Η περιγραφή είναι υποχρεωτική."); return; }
    transferLines.push({code, description: desc, qty});
    openTransferFormModal(fromStore);
  });

  document.getElementById("confirmTransferBtn").addEventListener("click", async ()=>{
    const to = document.getElementById("transferTo").value;
    // if there's unsaved data still sitting in the fields, add it as a
    // line automatically - the person shouldn't have to press "+
    // Προσθήκη γραμμής" first if they only have the one item to send
    const pendingDesc = document.getElementById("transferDesc").value.trim();
    if(pendingDesc){
      const code = document.getElementById("transferCode").value.trim();
      const qty = Math.max(1, Number(document.getElementById("transferQty").value)||1);
      transferLines.push({code, description: pendingDesc, qty});
    }
    if(!transferLines.length){
      alert("Πρόσθεσε τουλάχιστον μία γραμμή (κωδικός/περιγραφή/τεμάχια) πριν την ολοκλήρωση.");
      return;
    }
    for(const line of transferLines){
      if(to === "apothiki"){
        await sendTransferToWarehouse(line.code, line.description, line.qty, fromStore);
      } else {
        await sendTransferToStore(to, line.code, line.description, line.qty, fromStore);
      }
    }
    transferLines = [];
    closeModal();
  });
}

function orderPreviewLines(order, limit){
  limit = limit || 6;
  const lines = [];
  BOTTLE_TYPES.forEach(b=>{
    const qty = Number((order.bottles||{})[b.code]||0);
    if(qty>0) lines.push(`${b.name} × ${qty}`);
  });
  const clients = NAMED_CLIENTS[order.store] || [];
  clients.forEach(name=>{
    const map = (order.namedClientBottles && order.namedClientBottles[name]) || {};
    BOTTLE_TYPES.forEach(b=>{
      const qty = Number(map[b.code]||0);
      if(qty>0) lines.push(`${b.name} (${name}) × ${qty}`);
    });
  });
  (order.products||[]).forEach(p=>{
    lines.push(`${p.company?p.company+" — ":""}${p.name} × ${p.qty}`);
  });
  (order.extinguishers||[]).forEach(e=>{
    lines.push(`${e.customerName||e.name||""} × ${e.qty}`);
  });
  const shown = lines.slice(0, limit);
  const extra = lines.length - shown.length;
  return {shown, extra};
}

      <button class="close-x" data-action="close-modal">✕</button>
      <h3>Προσθήκη προϊόντος</h3>
      <label>Αναζήτηση με εταιρεία, όνομα ή κωδικό</label>
      <input type="text" id="prodSearch" placeholder="π.χ. Napoleon, TGS-4222…">
      <div id="prodResults" style="max-height:180px; overflow-y:auto; margin-top:10px;"></div>
      <div style="text-align:center; margin-top:14px;">
        <button class="btn btn-ghost" id="manualEntryBtn" style="font-size:12.5px;">Δεν το βρίσκω — προσθήκη χειροκίνητα</button>
      </div>
      <label style="margin-top:18px;">Ήδη επιλεγμένα</label>
      <div id="selectedProducts" style="max-height:200px; overflow-y:auto;"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="backToProductsBtn">‹ Πίσω</button>
      </div>
    </div>
  `);
  renderSelected();
  const renderResults = (q)=>{
    q = q.trim().toLowerCase();
    if(!q){ document.getElementById("prodResults").innerHTML = ""; return; }
    const companyMatches = [];
    const otherMatches = [];
    state.items.filter(it=>!it.placeholder).forEach(it=>{
      const company = (it.brand || it.subName || "").toLowerCase();
      if(company.includes(q)) companyMatches.push(it);
      else if((it.name||"").toLowerCase().includes(q) || (it.code||"").toLowerCase().includes(q)) otherMatches.push(it);
    });
    const matches = [...companyMatches, ...otherMatches].slice(0, 20);
    document.getElementById("prodResults").innerHTML = matches.map(it=>`
      <div class="order-line" style="cursor:pointer;" data-pick="${it.id}">
        <span class="order-line-code">#${esc(it.code||"")}</span>
        <span class="order-line-name">${esc(it.name)}<br><span style="font-size:11px; color:var(--text-faint);">${esc(it.brand || it.subName || "")}</span></span>
      </div>
    `).join("") || '<div style="font-size:12.5px; color:var(--text-faint);">Καμία αντιστοιχία.</div>';
    document.querySelectorAll("#prodResults [data-pick]").forEach(row=>{
      row.addEventListener("click", ()=>{
        const item = state.items.find(i=>i.id===row.dataset.pick);
        promptQtyAndAddProduct(orderId, item);
      });
    });
  };
  document.getElementById("prodSearch").addEventListener("input", e=>renderResults(e.target.value));
  document.getElementById("manualEntryBtn").addEventListener("click", ()=>openManualProductModal(orderId));
  document.getElementById("backToProductsBtn").addEventListener("click", ()=>openProductsPopup(orderId));
}

function promptQtyAndAddProduct(orderId, item){
  showModal(`
    <div class="modal" style="max-width:340px; position:relative;">
      <button class="close-x" data-action="close-modal">✕</button>
      <h3>${esc(item.name)}</h3>
      <div style="font-size:12px; color:var(--text-faint);">#${esc(item.code||"")}</div>
      <label>Ποσότητα</label>
      <input type="number" id="qtyInput" min="1" value="1">
      <div class="modal-actions">
        <button class="btn btn-ghost" id="cancelAddProd">Άκυρο</button>
        <button class="btn btn-primary" id="confirmAddProd">Προσθήκη</button>
      </div>
    </div>
  `);
  document.getElementById("cancelAddProd").addEventListener("click", ()=>openAddOrderProductModal(orderId));
  document.getElementById("confirmAddProd").addEventListener("click", async ()=>{
    const qty = Math.max(1, Number(document.getElementById("qtyInput").value) || 1);
    const order = state.orders.find(o=>o.id===orderId);
    const products = (order.products||[]).slice();
    const existingIdx = products.findIndex(p=>p.itemId===item.id);
    if(existingIdx >= 0){ products[existingIdx] = {...products[existingIdx], qty: products[existingIdx].qty + qty}; }
    else { products.push({itemId: item.id, code: item.code||"", name: item.name, company: item.brand || item.subName || "", qty}); }
    await updateDoc(doc(state.db, ORDERS_COLLECTION, orderId), {products, updatedAt: new Date().toISOString()});
    openAddOrderProductModal(orderId);
  });
}

/* manual entry for a product that isn't tracked in the warehouse at all */
function openManualProductModal(orderId){
  showModal(`
    <div class="modal" style="max-width:360px; position:relative;">
      <button class="close-x" data-action="close-modal">✕</button>
      <h3>Χειροκίνητη προσθήκη</h3>
      <label>Περιγραφή *</label>
      <input type="text" id="manualDesc" placeholder="π.χ. Ειδικό εξάρτημα κατόπιν παραγγελίας">
      <label>Κωδικός</label>
      <input type="text" id="manualCode" placeholder="προαιρετικό">
      <label>Ποσότητα</label>
      <input type="number" id="manualQty" min="1" value="1">
      <div class="modal-actions">
        <button class="btn btn-ghost" id="cancelManual">Άκυρο</button>
        <button class="btn btn-primary" id="confirmManual">Προσθήκη</button>
      </div>
    </div>
  `);
  document.getElementById("cancelManual").addEventListener("click", ()=>openAddOrderProductModal(orderId));
  document.getElementById("confirmManual").addEventListener("click", async ()=>{
    const name = document.getElementById("manualDesc").value.trim();
    if(!name){ alert("Η περιγραφή είναι υποχρεωτική."); return; }
    const code = document.getElementById("manualCode").value.trim();
    const qty = Math.max(1, Number(document.getElementById("manualQty").value) || 1);
    const order = state.orders.find(o=>o.id===orderId);
    const products = (order.products||[]).slice();
    products.push({itemId: null, code, name, qty});
    await updateDoc(doc(state.db, ORDERS_COLLECTION, orderId), {products, updatedAt: new Date().toISOString()});
    openAddOrderProductModal(orderId);
  });
}

function openAddExtinguisherModal(orderId){
  showModal(`
    <div class="modal" style="max-width:340px; position:relative;">
      <button class="close-x" data-action="close-modal">✕</button>
      <h3>Πυροσβεστήρας αναγόμωσης</h3>
      <label>Όνομα πελάτη</label>
      <input type="text" id="extCustomer" placeholder="π.χ. Παπαδάκης Γιώργος">
      <label>Ποσότητα</label>
      <input type="number" id="extQty" min="1" value="1">
      <label>Παρατηρήσεις</label>
      <textarea id="extNotes" placeholder="προαιρετικό"></textarea>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="cancelAddExt">Άκυρο</button>
        <button class="btn btn-primary" id="confirmAddExt">Προσθήκη</button>
      </div>
    </div>
  `);
  document.getElementById("cancelAddExt").addEventListener("click", ()=>openExtinguishersPopup(orderId, true));
  document.getElementById("confirmAddExt").addEventListener("click", async ()=>{
    const customerName = document.getElementById("extCustomer").value.trim();
    if(!customerName) return;
    const qty = Math.max(1, Number(document.getElementById("extQty").value) || 1);
    const notes = document.getElementById("extNotes").value.trim();
    const order = state.orders.find(o=>o.id===orderId);
    const extinguishers = (order.extinguishers||[]).slice();
    extinguishers.push({customerName, qty, notes});
    await updateDoc(doc(state.db, ORDERS_COLLECTION, orderId), {extinguishers, updatedAt: new Date().toISOString()});
    openExtinguishersPopup(orderId, true);
  });
}

loadFirebase();
</script>
